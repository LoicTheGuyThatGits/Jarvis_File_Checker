name: Tests
# Runs every test in tests/ on each push and pull request, so a change that breaks Jarvis is caught before it reaches your PC.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # some tests move HOME to a temporary folder; the browsers stay where they were installed
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
      TZ: Europe/Zurich
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the tests need
        # Windows-only parts (PyAutoGUI, pystray, sounddevice) are faked inside the tests.
        run: |
          python -m pip install --upgrade pip
          pip install Pillow psutil pypdf truststore numpy playwright python-docx openpyxl
          playwright install --with-deps chromium
      - name: Run the tests
        run: |
          failed=0
          for t in tests/test_*.py; do
            if timeout 300 python "$t" > /tmp/out.txt 2>&1; then
              echo "PASS $t"
            else
              echo "::group::FAIL $t"; tail -40 /tmp/out.txt; echo "::endgroup::"; failed=1
            fi
          done
          exit $failed
